{% extends "base.html" %}
{% block title %}{{ 'Edit' if row else 'Add' }} Booking Source{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-globe me-2"></i>{{ 'Edit' if row else 'Add' }} Booking Source</h2>
</div>
<div class="card" style="max-width:600px">
    <div class="card-body">
        <form method="post">
            {% if not row %}
            <div class="mb-3">
                <label class="form-label">Source ID</label>
                <input type="number" name="source_id" class="form-control" required>
            </div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Source Name</label>
                <input type="text" name="source_name" class="form-control" value="{{ row.source_name if row else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Commission Rate (%)</label>
                <input type="number" step="0.01" name="commission_rate" class="form-control" min="0" max="100" value="{{ row.commission_rate if row else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contact Info</label>
                <textarea name="contact_info" class="form-control" rows="2">{{ row.contact_info if row else '' }}</textarea>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a href="{{ url_for('booking_sources_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
