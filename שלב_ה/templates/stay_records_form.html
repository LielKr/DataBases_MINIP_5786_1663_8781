{% extends "base.html" %}
{% block title %}Add Stay Record{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-journal-text me-2"></i>Add Stay Record</h2>
</div>
<div class="card" style="max-width:600px">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Guest</label>
                <select name="guest_id" class="form-select" required>
                    <option value="">-- Select Guest --</option>
                    {% for g in guests %}
                    <option value="{{ g.guest_id }}">{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Booking ID</label>
                <select name="booking_id" class="form-select" required>
                    <option value="">-- Select Booking --</option>
                    {% for b in bookings %}
                    <option value="{{ b.booking_id }}">Booking #{{ b.booking_id }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Check-in Date</label>
                    <input type="date" name="check_in_date" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Check-out Date</label>
                    <input type="date" name="check_out_date" class="form-control" required>
                </div>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a href="{{ url_for('stay_records_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
