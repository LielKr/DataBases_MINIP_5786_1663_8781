{% extends "base.html" %}
{% block title %}{{ 'Edit' if row else 'New' }} Booking{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-calendar-check me-2"></i>{{ 'Edit' if row else 'New' }} Booking</h2>
</div>
<div class="card" style="max-width:600px">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Guest</label>
                <select name="guest_id" class="form-select" required>
                    <option value="">-- Select Guest --</option>
                    {% for g in guests %}
                    <option value="{{ g.guest_id }}" {% if row and row.guest_id == g.guest_id %}selected{% endif %}>{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Booking Source</label>
                <select name="source_id" class="form-select" required>
                    <option value="">-- Select Source --</option>
                    {% for s in sources %}
                    <option value="{{ s.source_id }}" {% if row and row.source_id == s.source_id %}selected{% endif %}>{{ s.source_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Check-in Date</label>
                    <input type="date" name="check_in_date" class="form-control" value="{{ row.check_in_date if row else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Check-out Date</label>
                    <input type="date" name="check_out_date" class="form-control" value="{{ row.check_out_date if row else '' }}" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Number of Guests</label>
                    <input type="number" name="num_guests" class="form-control" min="1" value="{{ row.num_guests if row else '1' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Total Price ($)</label>
                    <input type="number" step="0.01" name="total_price" class="form-control" min="0" value="{{ row.total_price if row else '' }}" required>
                </div>
            </div>
            {% if row %}
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="booking_status" class="form-select" required>
                    {% for s in ['CONFIRMED','COMPLETED','CANCELLED','NO_SHOW'] %}
                    <option value="{{ s }}" {% if row.booking_status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a href="{{ url_for('bookings_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
