{% extends "base.html" %}
{% block title %}Assign Room{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-key me-2"></i>Assign Room to Booking</h2>
</div>
<div class="card" style="max-width:600px">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Booking</label>
                <select name="booking_id" class="form-select" required>
                    <option value="">-- Select Booking --</option>
                    {% for b in bookings %}
                    <option value="{{ b.booking_id }}">Booking #{{ b.booking_id }} - {{ b.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Room</label>
                <select name="room_id" class="form-select" required>
                    <option value="">-- Select Room --</option>
                    {% for r in rooms %}
                    <option value="{{ r.room_id }}">{{ r.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Assign</button>
            <a href="{{ url_for('room_assignments_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
