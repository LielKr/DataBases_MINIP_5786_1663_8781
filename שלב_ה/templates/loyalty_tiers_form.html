{% extends "base.html" %}
{% block title %}{{ 'Edit' if row else 'Add' }} Loyalty Tier{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-award me-2"></i>{{ 'Edit' if row else 'Add' }} Loyalty Tier</h2>
</div>
<div class="card" style="max-width:600px">
    <div class="card-body">
        <form method="post">
            {% if not row %}
            <div class="mb-3">
                <label class="form-label">Tier ID</label>
                <input type="number" name="tier_id" class="form-control" required>
            </div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Tier Name</label>
                <input type="text" name="tier_name" class="form-control" value="{{ row.tier_name if row else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Points Required</label>
                <input type="number" name="points_required" class="form-control" min="0" value="{{ row.points_required if row else '0' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Discount Percentage (%)</label>
                <input type="number" step="0.01" name="discount_percentage" class="form-control" min="0" max="100" value="{{ row.discount_percentage if row else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Benefits Description</label>
                <textarea name="benefits_description" class="form-control" rows="2">{{ row.benefits_description if row else '' }}</textarea>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a href="{{ url_for('loyalty_tiers_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
