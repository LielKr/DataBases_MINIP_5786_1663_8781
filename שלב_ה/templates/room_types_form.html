{% extends "base.html" %}
{% block title %}{{ 'Edit' if row else 'Add' }} Room Type{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-grid-3x3-gap me-2"></i>{{ 'Edit' if row else 'Add' }} Room Type</h2>
</div>
<div class="card" style="max-width:600px">
    <div class="card-body">
        <form method="post">
            {% if not row %}
            <div class="mb-3">
                <label class="form-label">Type ID</label>
                <input type="number" name="type_id" class="form-control" required>
            </div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Type Name</label>
                <input type="text" name="type_name" class="form-control" value="{{ row.type_name if row else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Base Price ($)</label>
                <input type="number" step="0.01" name="base_price" class="form-control" value="{{ row.base_price if row else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Max Occupancy</label>
                <input type="number" name="max_occupancy" class="form-control" min="1" max="10" value="{{ row.max_occupancy if row else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="2">{{ row.description if row else '' }}</textarea>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a href="{{ url_for('room_types_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
