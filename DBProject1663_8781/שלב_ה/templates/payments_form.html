{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-credit-card me-2"></i>Record Payment</h2>
</div>
<div class="card" style="max-width:600px">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Stay</label>
                <select name="stay_id" class="form-select" required>
                    <option value="">-- Select Stay --</option>
                    {% for s in stays %}
                    <option value="{{ s.stay_id }}">{{ s.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Amount ($)</label>
                <input type="number" step="0.01" name="amount" class="form-control" min="0.01" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Payment Method</label>
                <select name="payment_method" class="form-select" required>
                    <option value="CREDIT_CARD">Credit Card</option>
                    <option value="DEBIT_CARD">Debit Card</option>
                    <option value="CASH">Cash</option>
                    <option value="BANK_TRANSFER">Bank Transfer</option>
                    <option value="CHECK">Check</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="payment_status" class="form-select" required>
                    <option value="COMPLETED">Completed</option>
                    <option value="PENDING">Pending</option>
                    <option value="REFUNDED">Refunded</option>
                    <option value="FAILED">Failed</option>
                </select>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a href="{{ url_for('payments_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
