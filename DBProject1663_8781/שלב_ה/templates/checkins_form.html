{% extends "base.html" %}
{% block title %}Record Check In/Out{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-box-arrow-in-right me-2"></i>Record Check In / Out</h2>
</div>
<div class="card" style="max-width:600px">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Booking</label>
                <select name="booking_id" class="form-select" required>
                    <option value="">-- Select Booking --</option>
                    {% for b in bookings %}
                    <option value="{{ b.booking_id }}">Booking #{{ b.booking_id }} - {{ b.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Actual Check-in Date</label>
                <input type="date" name="actual_check_in" class="form-control">
                <small class="text-muted">Leave empty if not checked in yet</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Actual Check-out Date</label>
                <input type="date" name="actual_check_out" class="form-control">
                <small class="text-muted">Leave empty if not checked out yet</small>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a href="{{ url_for('checkins_list') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
